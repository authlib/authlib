name: Release to PyPI

permissions:
  contents: read

on:
  push:
    tags:
      - "v1.*"

env:
  FORCE_COLOR: '1'

jobs:
  build:
    name: build dist files
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: 3.15

    - name: install build
      run: python -m pip install --upgrade build

    - name: build dist
      run: python -m build

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: artifacts
        path: dist/*
        if-no-files-found: error

  publish:
    environment:
      name: pypi-release
      url: https://pypi.org/project/Authlib/
    permissions:
      id-token: write
    name: release to pypi
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: artifacts
        path: dist

    - name: Push build artifacts to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: create github release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: create the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version="${GITHUB_REF_NAME#v}"
        docs="stable"
        flags=()
        if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then
          docs="latest"
          flags=(--prerelease)
        fi
        url="https://docs.authlib.org/en/${docs}/upgrades/changelog.html#changelog-${version//./-}"
        gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
          --notes "Changelog: $url" --generate-notes "${flags[@]}"
