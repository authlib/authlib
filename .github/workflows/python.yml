name: tests

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false

env:
  FORCE_COLOR: '1'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
        - "3.15"
        - "pypy3.11"
        include:
        - python: "3.14"
          sonar: true
        - python: "pypy3.11"
          skip_coverage: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml
        python-version: ${{ matrix.python }}

    - name: Install dependencies
      run: uv sync --group clients --group jose

    - name: Test with coverage
      if: ${{ !matrix.skip_coverage }}
      run: uv run pytest tests -n auto --cov=authlib --cov-report=term --cov-report=xml

    - name: Test
      if: ${{ matrix.skip_coverage }}
      run: uv run pytest tests -n auto

    - name: Test the documentation examples
      run: uv run pytest docs -n auto --dist loadfile

    - name: Check diff coverage for modified files
      if: ${{ github.event_name == 'pull_request' && !matrix.skip_coverage }}
      env:
        BASE_REF: ${{ github.base_ref }}
      run: uv run diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under=100 --format github-annotations:warning

    - name: Upload coverage to Codecov
      if: ${{ !matrix.skip_coverage }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: GitHub

    - name: SonarCloud Scan
      if: ${{ matrix.sonar }}
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      continue-on-error: true
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Minimize cache
      run: uv cache prune --ci

  minversions:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml
        cache-suffix: minversions

    - name: Set up Python 3.11
      run: uv python install 3.11

    - name: Install lowest direct versions
      run: uv sync --python 3.11 --resolution lowest-direct --upgrade --group clients --group jose

    - name: Test
      run: uv run --no-sync pytest tests -n auto

    - name: Minimize cache
      run: uv cache prune --ci
