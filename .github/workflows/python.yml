name: tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false

env:
  FORCE_COLOR: '1'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        python:
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
        - "3.15"
        - "pypy3.11"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Set up Python ${{ matrix.python }}
      run: uv python install ${{ matrix.python }}

    - name: Install dependencies
      run: uv sync --python ${{ matrix.python }} --group clients --group jose

    - name: Test with coverage
      run: uv run pytest tests -n auto --cov=authlib --cov-report=term --cov-report=xml

    - name: Check diff coverage for modified files
      if: github.event_name == 'pull_request'
      run: uv run diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=100 --format github-annotations:warning

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: GitHub

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      continue-on-error: true
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Minimize cache
      run: uv cache prune --ci

  minversions:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Set up Python 3.11
      run: uv python install 3.11

    - name: Install lowest direct versions
      run: uv sync --python 3.11 --resolution lowest-direct --upgrade --group clients --group jose

    - name: Test
      run: uv run --no-sync pytest tests -n auto

    - name: Minimize cache
      run: uv cache prune --ci
