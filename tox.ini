[tox]
requires =
    tox>=4.22
isolated_build = True
envlist =
    py{311,312,313,314,315,py311}
    py{311,312,313,314,315,py311}-{clients,flask,django,jose}
    py311-minversions
    py311-minversions-{clients,flask,django,jose}
    docs
    coverage

[testenv]
dependency_groups =
    dev
    jose: jose
    clients: clients
    flask: flask
    django: django

uv_resolution =
    minversions: lowest-direct

setenv =
    COVERAGE_FILE=.coverage.{envname}
    TESTPATH=tests/core
    jose: TESTPATH=tests/jose
    clients: TESTPATH=tests/clients
    flask: TESTPATH=tests/flask
    django: TESTPATH=tests/django
commands =
    pytest -n auto --cov=authlib --cov-report= {posargs: {env:TESTPATH}}

[testenv:docs]
dependency_groups =
    clients
    docs
    flask
commands =
    sphinx-build --builder html --write-all --jobs auto --fail-on-warning docs build/_html

[testenv:coverage]
skip_install = true
depends =
    py{311,312,313,314,315,py311}
    py{311,312,313,314,315,py311}-{clients,flask,django,jose}
    py311-minversions
    py311-minversions-{clients,flask,django,jose}
setenv =
    COVERAGE_FILE=.coverage
commands =
    coverage combine
    coverage report
    coverage html
